<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>ClassFetch</title>
  <link rel="stylesheet" href="../styles/styles.css" />
</head>

<body>
  <header class="header">
    <div class="logo-container">
      <img src="../icons/header-logo.png" alt="ClassFetch logo" class="logo" />
    </div>

    <div class="header-right">
      <a href="https://github.com/deeptejd/ClassFetch" target="_blank" rel="noopener noreferrer"
        aria-label="View source code on GitHub">
        <img src="https://github.githubassets.com/assets/GitHub-Mark-ea2971cee799.png" alt="GitHub" class="icon github-icon" />
      </a>
    </div>
  </header>


  <main class="main-content">
    <h3 class="section-title">Available Files</h3>
    <ul id="fileList" class="file-list" aria-label="List of downloadable files"></ul>

    <p id="status" class="status" role="status"></p>

    <div class="button-group">
      <button id="downloadSelected" class="primary-btn">Download Selected</button>
      <button id="downloadAll" class="primary-btn">Download All</button>
      <button id="refresh" class="secondary-btn">Refresh</button>
    </div>
  </main>

  <script src="../scripts/ext-api.js"></script>
  <script src="../scripts/popup.js"></script>
</body>

</html>
