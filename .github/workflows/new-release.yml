name: new release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  zip-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate manifest.json
        run: jq empty manifest.json

      - name: Verify tag matches manifest version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          MANIFEST_VERSION=$(jq -r .version manifest.json)
          if [ "$TAG_VERSION" != "$MANIFEST_VERSION" ]; then
            echo "Tag '$GITHUB_REF_NAME' does not match manifest.json version '$MANIFEST_VERSION'."
            exit 1
          fi

      - name: Create ZIP
        run: |
          mkdir classfetch
          cp -r icons scripts styles views manifest.json classfetch/
          zip -r classfetch-${GITHUB_REF_NAME}.zip classfetch

      - name: Push as a github release
        uses: ncipollo/release-action@v1
        with:
          name: "ClassFetch ${GITHUB_REF_NAME}"
          artifacts: classfetch-${{ github.ref_name }}.zip
          tag: ${{ github.ref_name }}
